apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-rag
  labels:
    app.kubernetes.io/name: distributed-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: distributed-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: STORAGE_BACKEND
              value: local
            - name: OBJECT_STORE_DIR
              value: /data/objects
            - name: CHROMA_DIR
              value: /data/chroma
            - name: HF_HOME
              value: /data/huggingface
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: distributed-rag-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distributed-rag-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
